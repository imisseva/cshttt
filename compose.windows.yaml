# Keep Linux dependencies on Docker's filesystem for faster Windows development.
# Paths are relative to frappe_docker/devcontainer-example/docker-compose.yml.
services:
  frappe:
    command:
      - bash
      - -lc
      - |
        if [ -f frappe-bench/sites/school.localhost/site_config.json ]; then
          cd frappe-bench
          exec bench start
        else
          exec sleep infinity
        fi
    volumes:
      - bench-data:/workspace/development
      - ../development/installer.py:/workspace/development/installer.py:ro
      - ../development/apps.json:/workspace/development/apps.json:ro
      - ../../custom_doctypes:/workspace/custom_doctypes:ro

volumes:
  bench-data:
